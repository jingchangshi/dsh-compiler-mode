# ─────────────────────────────────────────────────────────────────────────────
# @local/dsh-ai-compiler-preset — HOST-plane layer
#
# Everything here is a profile-wide service or a profile-wide capability that
# must exist BEFORE any preset mounts, exactly like the shipped host rows in
# @deepseek-ai/dsh-base / @deepseek-ai/dsh-web-app:
#
#   lsp / lsp-stdio / tool-lsp   code-navigation seam, clangd provider, `lsp` tool
#   agent-team / tool-agent-team / ui-agent-team
#                                Agent Teams service, tools and Web UI — the
#                                rows the shipped optional bundle
#                                `@deepseek-ai/dsh-experimental-agent-team-profile`
#                                declares, restated here so ONE `ai-compiler`
#                                bundle install can be enabled and rolled back.
#
# The preset (`cordis.patch.yml`) claims neither: a preset plugin that supplies
# a service must isolate the provider AND all consumers in one realm
# (agent-preset-registry/mount.ts), and `@deepseek-ai/dsh-lsp` is an abstract
# Service base class rather than a plugin, so a preset row for it never starts.
#
# Bundle order matters: this layer is applied after dsh-base and dsh-web-app
# (install appends to `dsh.profile.bundles`). `dsh-experimental-agent-team-profile`
# disables the four direct-delegation rows; those disables are NOT repeated here
# because the preset declares the same four ids, so an installation that does
# not select the experimental bundle would still get direct delegation.
# ─────────────────────────────────────────────────────────────────────────────
- insert:
    # ── code intelligence (A5) ────────────────────────────────────────────────
    - id: lsp
      name: '@deepseek-ai/dsh-lsp'

    - id: lsp-stdio
      name: '@deepseek-ai/dsh-lsp-stdio'
      config:
        servers:
          clangd:
            command: clangd
            args:
              # A 4900-entry compile_commands.json plus a 12k-file index would
              # otherwise re-index in the background and hold a .cache dir in
              # the tree under test; both are off for an on-demand navigator.
              - '--background-index=0'
              - '--pch-storage=memory'
              - '--log=error'
            extensionToLanguage:
              '.c': c
              '.h': c
              '.cc': cpp
              '.cpp': cpp
              '.cxx': cpp
              '.c++': cpp
              '.hh': cpp
              '.hpp': cpp
              '.hxx': cpp
              '.cu': cuda
              '.cuh': cuda
            # clangd itself derives the compile command from the nearest
            # `compile_commands.json` at or above each opened file (checked in
            # evidence/code-intelligence/cdb-parse-*.json), so no
            # --compile-commands-dir is pinned here: every project keeps its own.

    - id: tool-lsp
      name: '@deepseek-ai/dsh-tool-lsp'

    # ── Agent Teams (A4) — the shipped optional bundle's rows, unchanged ──────
    - id: agent-team
      name: '@deepseek-ai/dsh-experimental-agent-team'
      config:
        maxMembers: 8
        maxTasks: 256
        maxMessageBytes: 65536
        disposalTimeoutMs: 5000

    - id: tool-agent-team
      name: '@deepseek-ai/dsh-experimental-tool-agent-team'
      config:
        freshProvider: spawn
        forkProvider: fork

    - id: ui-agent-team
      name: '@deepseek-ai/dsh-experimental-client-ui-agent-team'

    # ── Provider-route fallback (quota headroom) ──────────────────────────────
    # A HOST row so it covers the Lead and every teammate (any agent that makes a
    # model request). The `corp` gateway has a per-DAY budget; when it is
    # exhausted every corp-family role (explorer/implementer/reviewer) would
    # otherwise fail the same way on every attempt. This remaps a degraded route
    # to its same-family counterpart on `magpie`, which keeps the role's model
    # lineage (qwen/deepseek/glm) while drawing on a separate budget.
    #
    # Only the three `corp` routes below are mapped. `magpie` routes — including
    # the group/architect|challenger|validator role models — deliberately have no
    # entry, so they pass through unchanged and are never switched across routes.
    # Targets must be ids the live profile actually declares: the qwen family is
    # `group/qwen-3.8-flash` (old `auto/` and `opencode-go/` ids are gone).
    #
    # Trigger: quota/auth-class failures only (QUOTA, AUTH, plus a generic 429
    # whose message names budget/quota). STICKY: once failed over, the agent
    # never returns to the primary on its own — a per-day quota does not recover
    # within a session, and toggling back would re-hit the dead key. A new
    # session / Host restart starts the probe over. `globalSticky` also lets a
    # sibling agent start directly on the fallback instead of eating the first
    # doomed attempt.
    - id: ai-compiler-llm-fallback
      name: '@local/dsh-ai-compiler-preset/plugins/llm-fallback'
      config:
        routes:
          - from: { provider: corp, model: Qwen3.8-Flash }
            to:
              - { provider: magpie, model: group/qwen-3.8-flash }
          - from: { provider: corp, model: DeepSeek-V4.1-Flash-1017 }
            to:
              - { provider: magpie, model: auto/deepseek-v4.1-flash }
          - from: { provider: corp, model: GLM-5.3-Flash }
            to:
              - { provider: magpie, model: auto/glm-5.3-flash }
        onCodes: [QUOTA, AUTH]
        globalSticky: true
        maxHops: 3

    # ── AgentGates completion gate (P5b) ──────────────────────────────────────
    # A HOST row, not a preset row: the policy must be registered on the Agent
    # Teams service so EVERY preset that can complete a task consults it. A
    # preset-scoped row would let a Standard-mode session complete a task the
    # compiler mode had declared must be gated.
    #
    # The plugin decides nothing itself. It forwards a task's declared
    # requirement to AgentGates (verify-requirements over the published CLI)
    # and reports that verdict. Duplicating the Python verification here would
    # create a second authority that could disagree with the receipt.
    #
    # The row resolves through the bundle's own package exports map, so the
    # row names a stable module id rather than a filesystem path: moving this
    # checkout cannot leave the policy unresolvable.
    #
    # It is inert for tasks that declare no agentgates requirement: the Team
    # domain never consults a policy for a task without requirements, so this
    # row cannot force a build onto ordinary tasks.
    - id: agentgates-completion-policy
      name: '@local/dsh-ai-compiler-preset/plugins/agentgates-policy'
      config:
        python: !!js process.env.AGENT_GATES_MCP_PYTHON
        packageRoot: !!js process.env.AGENT_GATES_ROOT
        configFile: !!js process.env.AGENT_GATES_CONFIG ?? (process.env.HOME + '/.config/agent-gates/config.toml')
        timeoutMs: 120000

