# ─────────────────────────────────────────────────────────────────────────────
# @local/dsh-ai-compiler-preset — bundle patch layer
#
# Declares ONE agent preset: `ai-compiler` (display name "AI Compiler
# Engineering"). Applied after @deepseek-ai/dsh-base and @deepseek-ai/dsh-web-app
# (and after @deepseek-ai/dsh-experimental-agent-team-profile when installed), so
# this file only ever *adds* a row: it never overrides Standard, PTC, minimal or
# cordis, and it never disables a shipped row.
#
# Baseline: packages/bundle/web-app/presets/ptc.patch.yml @ dsh-v0.2.1-rc.3
# (commit 1f81c047fc). Every deviation from that baseline is marked `# DIFF:`.
# See docs/02-source-audit.md and config/ai-compiler.diff-notes.md.
# ─────────────────────────────────────────────────────────────────────────────
- insert:
    - id: preset-ai-compiler
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: ai-compiler
        name: AI Compiler Engineering
        description: PTC programmatic tools with native spill/compaction context management, agent-team delegation, and clangd code navigation for compiler engineering.
        order: 3
        plugins:
          # ── baseline: unchanged from ptc.patch.yml ─────────────────────────
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              # DIFF: compiler-engineering framing plus the Team role table.
              # Behaviour still comes from tools and runtime, never from this
              # text (A1 principle 10); the table only tells the Lead which
              # agent_options to pass to spawn_teammate, and omission stays safe
              # because an omitted route inherits the Lead's own.
              prefix: |-
                You are an AI compiler engineering agent powered by the {{model}} model.

                Team roles. Pick the smallest tier that fits the task, then pass the listed
                `agent_options` to `spawn_teammate`. Omit `agent_options` for a role you do
                not route: omission inherits your own route and is always safe.
                  architect   provider "magpie", model "codex/gpt-6.1-sol"
                  explorer    provider "corp",   model "Qwen3.8-Flash"
                  implementer provider "corp",   model "DeepSeek-V4.1-Flash-1017"
                  reviewer    provider "corp",   model "GLM-5.3-Flash"
                  challenger  provider "magpie", model "codex/gpt-6.1-sol"
                  validator   provider "magpie", model "auto/mimo-v2.6-flash"
                Do not pass `maxTokens` or `reasoningEffort`: no configured model declares a
                reasoning capability, and an inherited output budget is the safe default.

                Tiers: a small task runs as a single agent; ordinary development is you plus
                implementer and validator; architecture or parallel work is you plus explorer,
                architect, implementer, reviewer and challenger. Only the implementer edits
                files; every other role reports. Record role ownership on the shared task
                board and express ordering with `blocked_by` rather than waiting inside one
                program.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              # DIFF: raised from the PTC baseline (8192/4096/1024). Compiler
              # evidence (build logs, IR dumps) is long and structured; the
              # native spill policy (12500 estimated tokens, host plane) is the
              # first line of defence, so the pruner only has to catch results
              # that stay under it. See docs/07-benchmarks.md.
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 20480
                  headChars: 12288
                  tailChars: 4096
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              # DIFF (Q18 defect, measured): the four direct-delegation rows
              # are DISABLED. The bundle's host layer mounts the Team tools
              # (`tool-agent-team`), so leaving `subagent`/`subagent_fork` on
              # handed the model two competing delegation surfaces and it chose
              # the direct one — case A run-00 (evidence/e2e/case-a/
              # run-00-stale-server) shows the model writing
              # `tools.subagent({...})` and never touching the Team API.
              # The rows stay DECLARED so the ids keep their place in the tree
              # and a profile that composes Team can still address them.
              - id: tool-subagent-control
                disabled: true
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                disabled: true
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                disabled: true
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
              - id: tool-subagent-fork
                disabled: true
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                disabled: true
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
                disabled: true
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: tool-presentation
            name: '@deepseek-ai/dsh-agent-tool-presentation'
            config:
              mode: ptc
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
          - id: tool-plugin-market
            name: '@deepseek-ai/dsh-plugin-market/tools'
            disabled: true

          # ── DIFF: code intelligence (A5) ──────────────────────────────────
          # `lsp` is a HOST-plane service: `@deepseek-ai/dsh-lsp` is an abstract
          # `Service` base class, not a plugin. With `patch: '@deepseek-ai/dsh-lsp'`
          # the Loader imports the module and finds only named exports, so the row
          # has a module namespace and no fiber — `auditRows()` reports it as
          # "never started" and the WHOLE preset fails to mount (measured in
          # tests/e2e/headless-run: `agent-preset/invalid`). The seam therefore
          # belongs to a profile bundle that mounts it as a host row, exactly as
          # every other shared service does; the preset owns only the provider +
          # tool that consume it.
          #   host row needed:  - id: lsp / name: '@deepseek-ai/dsh-lsp'
          #                     - id: tool-lsp / name: '@deepseek-ai/dsh-tool-lsp'
          #                     - id: lsp-stdio / name: '@deepseek-ai/dsh-lsp-stdio' (clangd)
          # See docs/01-architecture.md and docs/02-source-audit.md Q02b.
